name: Report examples on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'docs/report-examples/**'
      - 'tools/build-report-pages.py'
      - '.github/workflows/report-pages.yml'
  pull_request:
    paths:
      - 'examples/**'
      - 'docs/report-examples/**'
      - 'tools/build-report-pages.py'
      - '.github/workflows/report-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: report-pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify and prepare report examples
        run: python3 tools/build-report-pages.py _site
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy report examples
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

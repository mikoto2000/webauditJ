name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify (Unix)
        if: runner.os != 'Windows'
        run: ./mvnw -B -ntp -s .mvn/settings.xml verify
      - name: Verify (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B -ntp -s .mvn/settings.xml verify
      - name: Inspect executable JAR
        run: python tools/verify_jar.py
      - name: Deny application network access
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: python tools/verify_offline.py
      - uses: actions/upload-artifact@v4
        with:
          name: webauditJ-${{ runner.os }}
          path: |
            target/webauditJ.jar
            target/surefire-reports/*.xml
